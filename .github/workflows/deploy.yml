name: Deploy to GitHub Pages

on:
  # Deploy only after "Dashboard CI" passes on main. This previously ran on every push
  # to main with no dependency on CI, so a commit failing unit tests or the bundle
  # budgets still shipped to the app that owners and tenants use for money.
  workflow_run:
    workflows: ["Dashboard CI"]
    types: [completed]
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run fires on completion whatever the outcome, so gate on success.
    # workflow_dispatch stays open as a deliberate manual escape hatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      entry: ${{ steps.built.outputs.entry }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run defaults to the default branch; pin to the exact commit CI
          # validated so we never ship something CI did not actually test.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://lpklmquhxgbpavjngbby.supabase.co/functions/v1/api
          VITE_BASE_PATH: /
      
      - name: Record built entry asset
        id: built
        run: |
          ENTRY=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)
          if [ -z "$ENTRY" ]; then
            echo "::error::Could not find the hashed entry chunk in dist/index.html"
            exit 1
          fi
          echo "entry=$ENTRY" >> "$GITHUB_OUTPUT"
          echo "This build's entry chunk: $ENTRY"
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Same zone as www (CF_API_TOKEN / CF_ZONE_ID). Hostname purge for the app
  # host only — never purge_everything. Missing secrets: warn and continue so
  # forks still deploy; present but failed API call: fail.
  purge-cloudflare:
    needs: deploy
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      purged: ${{ steps.purge.outputs.purged }}
    steps:
      - name: Purge Cloudflare cache (app host)
        id: purge
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set +x
          TOKEN="${CF_API_TOKEN:-${CLOUDFLARE_API_TOKEN:-}}"
          ZONE="${CF_ZONE_ID:-${CLOUDFLARE_ZONE_ID:-}}"
          if [ -z "$TOKEN" ] || [ -z "$ZONE" ]; then
            echo "purged=skipped" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare cache purge skipped: set repository secrets CF_API_TOKEN and CF_ZONE_ID (aliases CLOUDFLARE_API_TOKEN and CLOUDFLARE_ZONE_ID). Forks without secrets still succeed."
            exit 0
          fi
          export TOKEN ZONE
          HTTP=$(curl -sS -o /tmp/cf-zone.json -w "%{http_code}" \
            -X GET "https://api.cloudflare.com/client/v4/zones/${ZONE}" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json")
          export CF_ZONE_HTTP="$HTTP"
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error

          token = os.environ["TOKEN"]
          zone = os.environ["ZONE"]
          expected = "ondorealestate.com"
          http = os.environ.get("CF_ZONE_HTTP", "")
          github_output = os.environ["GITHUB_OUTPUT"]

          def fail(msg: str) -> None:
              print(f"::error::{msg}", file=sys.stderr)
              sys.exit(1)

          def purge(payload: dict, label: str) -> None:
              req = urllib.request.Request(
                  f"https://api.cloudflare.com/client/v4/zones/{zone}/purge_cache",
                  data=json.dumps(payload).encode(),
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      purge_http = resp.status
                      data = json.loads(resp.read())
              except urllib.error.HTTPError as exc:
                  purge_http = exc.code
                  raw = exc.read().decode()
                  try:
                      data = json.loads(raw)
                  except json.JSONDecodeError:
                      fail(f"Cloudflare cache purge HTTP {purge_http}: {raw[:240]}")
              except urllib.error.URLError as exc:
                  fail(f"Cloudflare cache purge network error: {exc}")
              print(label, json.dumps({k: data.get(k) for k in ("success", "errors", "messages")}, indent=2))
              if purge_http != 200 or not data.get("success"):
                  fail(f"Cloudflare cache purge failed ({label}). Token needs Zone Cache Purge. Never purge_everything.")

          try:
              with open("/tmp/cf-zone.json", encoding="utf-8") as f:
                  zone_body = json.load(f)
          except (OSError, json.JSONDecodeError) as exc:
              fail(f"Cloudflare zone lookup: could not parse API response ({exc}).")

          if http == "403":
              print("::warning::Token cannot GET the zone; skipping name check and continuing with hostname purge.")
          elif http != "200" or not zone_body.get("success"):
              fail("Cloudflare zone lookup failed. Token needs Zone Read on the ondorealestate.com zone.")
          else:
              name = (zone_body.get("result") or {}).get("name")
              if name != expected:
                  fail(f"Refusing purge: zone is {name!r}, expected {expected!r}.")
              print(f"Zone ok: {name}")

          # Cloudflare allows only one of hosts/files/tags/prefixes per request.
          purge({"hosts": ["app.ondorealestate.com"]}, "hosts")
          purge({"files": [
              "https://app.ondorealestate.com/",
              "https://app.ondorealestate.com/index.html",
          ]}, "files")
          with open(github_output, "a", encoding="utf-8") as fh:
              fh.write("purged=yes\n")
          print("Cloudflare cache purged for app.ondorealestate.com (hosts and HTML URLs).")
          PY

  # Vite fingerprints the entry chunk. Prefer the custom-domain HTML, but GitHub
  # Pages Fastly caches it for max-age=600 and often ignores ?cb=. These hosts
  # typically show CF-Cache-Status: DYNAMIC, so a Cloudflare purge does not move
  # the document. Fail only if Pages origin never serves this build.
  verify-production:
    needs: [deploy, purge-cloudflare]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify production is serving this build
        env:
          EXPECTED_ENTRY: ${{ needs.deploy.outputs.entry }}
          PURGED: ${{ needs.purge-cloudflare.outputs.purged }}
        run: |
          set -euo pipefail
          SITE="https://app.ondorealestate.com"
          PAGES_IP="185.199.108.153"
          ATTEMPTS=40
          FASTLY_GRACE=8

          if [ -z "$EXPECTED_ENTRY" ]; then
            echo "::error::Build did not report an entry chunk; cannot verify the deploy."
            exit 1
          fi
          echo "Expecting production to reference ${EXPECTED_ENTRY} (cloudflare_purge=${PURGED:-unknown})."

          ORIGIN_MATCH=0
          ORIGIN_SEEN_AT=0
          for attempt in $(seq 1 "$ATTEMPTS"); do
            CB=$(date +%s%N)
            STATUS=$(curl -sS --compressed -D /tmp/app-home.hdr -o /tmp/app-home.html -w '%{http_code}' --max-time 30 "$SITE/?cb=$CB" || true)
            CF_STATUS=$(grep -i '^cf-cache-status:' /tmp/app-home.hdr | awk '{print $2}' | tr -d '\r' || true)
            X_CACHE=$(grep -i '^x-cache:' /tmp/app-home.hdr | awk '{print $2}' | tr -d '\r' || true)
            if grep -q "$EXPECTED_ENTRY" /tmp/app-home.html 2>/dev/null; then
              echo "attempt ${attempt}/${ATTEMPTS}: homepage=${STATUS} cf=${CF_STATUS:-none} x-cache=${X_CACHE:-none} entry matched."
              exit 0
            fi
            LIVE=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' /tmp/app-home.html 2>/dev/null | head -1 || true)
            echo "attempt ${attempt}/${ATTEMPTS}: homepage=${STATUS} cf=${CF_STATUS:-none} x-cache=${X_CACHE:-none} live_entry=${LIVE:-none} expected=${EXPECTED_ENTRY}"

            ORIGIN_STATUS=$(curl -sk --compressed --resolve "app.ondorealestate.com:443:${PAGES_IP}" -o /tmp/app-origin.html -w '%{http_code}' --max-time 20 "$SITE/" || true)
            ORIGIN_LIVE=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' /tmp/app-origin.html 2>/dev/null | head -1 || true)
            echo "attempt ${attempt}/${ATTEMPTS}: pages-origin=${ORIGIN_STATUS} origin_entry=${ORIGIN_LIVE:-none}"
            if grep -q "$EXPECTED_ENTRY" /tmp/app-origin.html 2>/dev/null; then
              if [ "$ORIGIN_MATCH" != "1" ]; then
                ORIGIN_MATCH=1
                ORIGIN_SEEN_AT=$attempt
                echo "::warning::GitHub Pages origin has ${EXPECTED_ENTRY}; app.ondorealestate.com still has ${LIVE:-other}. CF-Cache-Status=${CF_STATUS:-unknown} (DYNAMIC means Fastly, not Cloudflare, is the HTML cache)."
              fi
              elapsed=$((attempt - ORIGIN_SEEN_AT))
              if [ "$elapsed" -ge "$FASTLY_GRACE" ]; then
                echo "Pages origin has been serving this build for ${elapsed} attempts. Accepting GitHub Fastly custom-domain lag."
                exit 0
              fi
            fi
            sleep 15
          done

          if [ "$ORIGIN_MATCH" = "1" ]; then
            echo "::warning::GitHub Pages origin served ${EXPECTED_ENTRY} but app.ondorealestate.com did not within the retry window. Fastly caches Pages HTML for ~10 minutes and cannot be purged here."
            exit 0
          fi
          echo "::error::GitHub Pages origin never served ${EXPECTED_ENTRY}. The Pages deploy did not publish this build."
          exit 1
