name: Deploy to GitHub Pages

on:
  # Deploy only after "Dashboard CI" passes on main. This previously ran on every push
  # to main with no dependency on CI, so a commit failing unit tests or the bundle
  # budgets still shipped to the app that owners and tenants use for money.
  workflow_run:
    workflows: ["Dashboard CI"]
    types: [completed]
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run fires on completion whatever the outcome, so gate on success.
    # workflow_dispatch stays open as a deliberate manual escape hatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      entry: ${{ steps.built.outputs.entry }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run defaults to the default branch; pin to the exact commit CI
          # validated so we never ship something CI did not actually test.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://lpklmquhxgbpavjngbby.supabase.co/functions/v1/api
          VITE_BASE_PATH: /
      
      - name: Record built entry asset
        id: built
        run: |
          ENTRY=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)
          if [ -z "$ENTRY" ]; then
            echo "::error::Could not find the hashed entry chunk in dist/index.html"
            exit 1
          fi
          echo "entry=$ENTRY" >> "$GITHUB_OUTPUT"
          echo "This build's entry chunk: $ENTRY"

      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Same zone as www (CF_API_TOKEN / CF_ZONE_ID). Hostname purge for the app
  # host only — never purge_everything. Missing secrets: warn and continue so
  # forks still deploy; present but failed API call: fail.
  purge-cloudflare:
    needs: deploy
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Purge Cloudflare cache (app host)
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set +x
          TOKEN="${CF_API_TOKEN:-${CLOUDFLARE_API_TOKEN:-}}"
          ZONE="${CF_ZONE_ID:-${CLOUDFLARE_ZONE_ID:-}}"
          if [ -z "$TOKEN" ] || [ -z "$ZONE" ]; then
            echo "::warning::Cloudflare cache purge skipped: set repository secrets CF_API_TOKEN and CF_ZONE_ID (aliases CLOUDFLARE_API_TOKEN and CLOUDFLARE_ZONE_ID). Forks without secrets still succeed."
            exit 0
          fi
          export TOKEN ZONE
          HTTP=$(curl -sS -o /tmp/cf-zone.json -w "%{http_code}" \
            -X GET "https://api.cloudflare.com/client/v4/zones/${ZONE}" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json")
          export CF_ZONE_HTTP="$HTTP"
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error

          token = os.environ["TOKEN"]
          zone = os.environ["ZONE"]
          expected = "ondorealestate.com"
          http = os.environ.get("CF_ZONE_HTTP", "")

          def fail(msg: str) -> None:
              print(f"::error::{msg}", file=sys.stderr)
              sys.exit(1)

          try:
              with open("/tmp/cf-zone.json", encoding="utf-8") as f:
                  zone_body = json.load(f)
          except (OSError, json.JSONDecodeError) as exc:
              fail(f"Cloudflare zone lookup: could not parse API response ({exc}).")

          if http == "403":
              print("::warning::Token cannot GET the zone; skipping name check and continuing with hostname purge.")
          elif http != "200" or not zone_body.get("success"):
              fail("Cloudflare zone lookup failed. Token needs Zone Read on the ondorealestate.com zone.")
          else:
              name = (zone_body.get("result") or {}).get("name")
              if name != expected:
                  fail(f"Refusing purge: zone is {name!r}, expected {expected!r}.")
              print(f"Zone ok: {name}")

          payload = json.dumps({"hosts": ["app.ondorealestate.com"]}).encode()
          req = urllib.request.Request(
              f"https://api.cloudflare.com/client/v4/zones/{zone}/purge_cache",
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                  purge_http = resp.status
                  data = json.loads(resp.read())
          except urllib.error.HTTPError as exc:
              purge_http = exc.code
              raw = exc.read().decode()
              try:
                  data = json.loads(raw)
              except json.JSONDecodeError:
                  fail(f"Cloudflare cache purge HTTP {purge_http}: {raw[:240]}")
          except urllib.error.URLError as exc:
              fail(f"Cloudflare cache purge network error: {exc}")

          print(json.dumps({k: data.get(k) for k in ("success", "errors", "messages")}, indent=2))
          if purge_http != 200 or not data.get("success"):
              fail("Cloudflare cache purge failed. Token needs Zone Cache Purge. Payload is hostname purge for app.ondorealestate.com (not purge_everything).")
          print("Cloudflare cache purged by hostname for app.ondorealestate.com.")
          PY

  # A deploy that reports success but never reaches the edge is now a red build.
  # Vite fingerprints the entry chunk, so "is production serving THIS build?" is an
  # exact string comparison rather than a guess. Runs after hostname purge so the
  # smoke is not comparing against a stale Fastly/Cloudflare HTML document.
  verify-production:
    needs: [deploy, purge-cloudflare]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify production is serving this build
        env:
          EXPECTED_ENTRY: ${{ needs.deploy.outputs.entry }}
        run: |
          SITE="https://app.ondorealestate.com"

          if [ -z "$EXPECTED_ENTRY" ]; then
            echo "::error::Build did not report an entry chunk; cannot verify the deploy."
            exit 1
          fi
          echo "Expecting production to reference ${EXPECTED_ENTRY}."

          for attempt in $(seq 1 20); do
            CB=$(date +%s%N)
            BODY=$(curl -fsS --max-time 30 "$SITE/?cb=$CB" || true)
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$SITE/?cb=$CB")
            if printf '%s' "$BODY" | grep -q "$EXPECTED_ENTRY"; then
              echo "attempt ${attempt}/20: homepage=${STATUS} entry matched — production is serving this build."
              exit 0
            fi
            LIVE=$(printf '%s' "$BODY" | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1)
            echo "attempt ${attempt}/20: homepage=${STATUS} live_entry=${LIVE:-none} expected=${EXPECTED_ENTRY}"
            sleep 15
          done

          echo "::error::Production never converged on this build (expected ${EXPECTED_ENTRY}). The deploy reported success but app.ondorealestate.com is not serving it."
          exit 1
